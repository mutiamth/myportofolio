{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h1>Login</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="button">Login</button>
    </form>

    <p>
        Don't have an account?
        <a href="{% url 'main:register' %}">Register here</a>
    </p>
</div>
{% endblock %}
